name: Deploy Quartz to GitHub Pages

on:
  push:
    branches:
      - main
      - v5
  schedule:
    - cron: '0 15 * * *' # Every day at 00:00 KST (15:00 UTC)
  repository_dispatch:
    types: [sync-blog]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Restore Content Cache
        uses: actions/cache@v6
        with:
          path: |
            content
            .sync_manifest.json
          key: gdrive-content-${{ github.run_id }}
          restore-keys: |
            gdrive-content-

      - name: Sync content from Google Drive (Incremental)
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          if [ -n "$GDRIVE_CREDENTIALS" ] && [ -n "$GDRIVE_FOLDER_ID" ]; then
            echo "Google Drive credentials found. Running Incremental Sync..."
            pip install google-api-python-client google-auth
            python .github/scripts/sync_gdrive.py
          else
            echo "Google Drive credentials not configured. Skipping sync."
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Quartz
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

